      <stop offset="0.55" stop-color="#0d2740"/>
      <stop offset="1" stop-color="#06111c"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#5aa7e9" stop-opacity="0.55"/><stop offset="1" stop-color="#5aa7e9" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#2b7fd4" stop-opacity="0.5"/><stop offset="1" stop-color="#2b7fd4" stop-opacity="0"/></radialGradient>
