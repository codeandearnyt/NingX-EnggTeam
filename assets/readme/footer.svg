<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Made by Nitin Sharma">
  <title>Made by Nitin Sharma</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06111c"/>
      <stop offset="0.5" stop-color="#0d2740"/>
      <stop offset="1" stop-color="#06111c"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0.75" y="0.75" width="1198.5" height="118.5" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="120" fill="url(#band)"/>
    
  <path d="M-400 88 q 100 -22 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 L 1600 240 L -400 240 Z"
        fill="#5aa7e9" fill-opacity="0.16">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 200 0; 0 0" dur="9s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </path>
    
  <path d="M-400 104 q 100 -16 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 t 200 0 L 1600 240 L -400 240 Z"
        fill="#5aa7e9" fill-opacity="0.22">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 200 0; 0 0" dur="13s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </path>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="118.5" rx="18"
        fill="none" stroke="#1b3f66" stroke-width="1.5"/>

  <text x="600" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16"
        font-weight="700" fill="#a9d8f8">Made by Nitin Sharma</text>
  <text x="600" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12"
        fill="#8fb0cd">Twelve roles · twenty-four UI types · one guard</text>
</svg>
